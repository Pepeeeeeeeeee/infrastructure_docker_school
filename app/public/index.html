<!DOCTYPE html>
<html>
<head>

    <title>Infrastructure Chat</title>

    <style>

        body {
            font-family: Arial;
            margin: 40px;
        }

        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px;
        }

    </style>

</head>

<body>

<h1>Infrastructure Chat</h1>

<div id="messages"></div>

<input id="usernameInput" placeholder="Username">

<input id="messageInput" placeholder="Message">

<button onclick="sendMessage()">Send</button>

<script>

async function loadMessages() {

    const res = await fetch('/messages');

    const messages = await res.json();

    const div = document.getElementById('messages');

    div.innerHTML = '';

    messages.forEach(m => {

        div.innerHTML += `
            <p>
                <b>${m.username}</b>
                (${m.created_at})
                :
                ${m.message}
            </p>
        `;
    });
}

async function sendMessage() {

    const username =
        document.getElementById('usernameInput').value;

    const message =
        document.getElementById('messageInput').value;

    await fetch('/messages', {

        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({
            username,
            message
        })
    });

    document.getElementById('messageInput').value = '';

    loadMessages();
}

loadMessages();

setInterval(loadMessages, 2000);

</script>

</body>
</html>
